name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lock-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate authoritative dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Print dependency lock for repository update
        run: cat package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
