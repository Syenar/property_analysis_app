name: Inspect Arizona Memory Search
on:
  workflow_dispatch:
  push:
    branches: [temp-cloudflare-preview]
    paths: [.github/workflows/inspect-azmemory.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test property-derived Arizona catalog queries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,uuid,urllib.request
          endpoint='https://na5.iiivega.com/api/search-result/search/format-groups'
          headers={
            'Content-Type':'application/json','Accept':'application/json, text/plain, */*',
            'api-version':'2','iii-customer-domain':'asli.na5.iiivega.com','iii-host-domain':'asli.na5.iiivega.com',
            'Origin':'https://asli.na5.iiivega.com','Referer':'https://asli.na5.iiivega.com/'
          }
          queries=[
            '1700 W Washington St Phoenix AZ',
            '1700 West Washington Street Phoenix Arizona',
            '1700 W Washington St Phoenix architectural drawings',
            '1700 W Washington St Phoenix building plans',
            '1700 W Washington Phoenix Arizona Capitol',
            'State of Arizona 1700 W Washington Phoenix',
          ]
          for q in queries:
            body=json.dumps({'searchText':q,'sorting':'relevance','sortOrder':'asc','searchType':'everything','pageNum':0,'pageSize':20,'resourceType':'FormatGroup'}).encode()
            h=dict(headers); h['Anonymous-User-Id']=str(uuid.uuid4())
            req=urllib.request.Request(endpoint,data=body,headers=h,method='POST')
            with urllib.request.urlopen(req,timeout=30) as resp: data=json.load(resp)
            print('\nQUERY',q,'TOTAL',data.get('totalResults'))
            for i,r in enumerate(data.get('data',[])[:10],1):
              urls=[]
              for tab in r.get('materialTabs') or []: urls += ((tab.get('availability') or {}).get('urls') or [])
              print(i,repr(r.get('title')),r.get('publicationDate'),urls[:2],repr((r.get('materialTabs') or [{}])[0].get('description','')))
            cap=[r for r in data.get('data',[]) if "Architect's plan for the Arizona State Capitol" in (r.get('title') or '')]
            print('CAPITOL_PLAN_MATCHES',len(cap))
          PY
