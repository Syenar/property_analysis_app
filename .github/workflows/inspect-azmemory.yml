name: Inspect Arizona Memory Search
on:
  workflow_dispatch:
  push:
    branches: [temp-cloudflare-preview]
    paths: [.github/workflows/inspect-azmemory.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Search Arizona harvested catalog in a real browser
        shell: bash
        run: |
          set -u
          base='https://asli.na5.iiivega.com'
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          echo "Chrome: $chrome"
          if [ -z "$chrome" ]; then exit 2; fi
          for query in 'Arizona State Capitol' 'Architects plan for the Arizona State Capitol in Phoenix' '02-0299' '02-0300'; do
            encoded=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$query")
            url="$base/search?query=$encoded&searchType=everything&pageSize=20"
            echo "=== $query ==="
            timeout 50s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom "$url" > /tmp/dom.html 2>/tmp/chrome.err || true
            echo "DOM bytes=$(wc -c </tmp/dom.html 2>/dev/null || echo 0)"
            python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('/tmp/dom.html').read_text(errors='replace')
          text=re.sub(r'<[^>]+>',' ',html)
          text=re.sub(r'\s+',' ',text)
          for term in ['Arizona State Capitol','02-0299','02-0300','architectural drawing','No results','results found']:
              i=text.lower().find(term.lower())
              if i>=0: print(term, '=>', text[max(0,i-250):i+500])
          for m in re.finditer(r'href="([^"]+)"',html,re.I):
              href=m.group(1)
              if 'recordId=' in href or '/search/card' in href or 'azmemory' in href.lower(): print('HREF',href)
          PY
            echo '--- chrome errors ---'; tail -30 /tmp/chrome.err || true
          done
