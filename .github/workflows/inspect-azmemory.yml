name: Inspect Arizona Memory Search
on:
  workflow_dispatch:
  push:
    branches: [temp-cloudflare-preview]
    paths: [.github/workflows/inspect-azmemory.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture public Arizona catalog network endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://asli.na5.iiivega.com'
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          query='Architects plan for the Arizona State Capitol in Phoenix'
          encoded=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$query")
          url="$base/search?query=$encoded&searchType=everything&pageSize=20"
          rm -f /tmp/netlog.json /tmp/dom.html
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --log-net-log=/tmp/netlog.json --net-log-capture-mode=IncludeSensitive --dump-dom "$url" > /tmp/dom.html 2>/tmp/chrome.err || true
          grep -q "Architect's plan for the Arizona State Capitol in Phoenix" /tmp/dom.html
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('/tmp/netlog.json')
          data=json.loads(p.read_text(errors='replace'))
          urls=[]
          def walk(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k.lower() in {'url','uri'} and isinstance(v,str) and v.startswith('http'):
                          urls.append(v)
                      walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)
          seen=set()
          for u in urls:
              if u in seen: continue
              seen.add(u)
              if any(s in u.lower() for s in ['api','search','query','graphql','formatgroup','record','vega','polaris','discovery']):
                  print(u)
          print('UNIQUE_URLS',len(seen))
          PY
          echo '--- likely JSON responses / request URLs from netlog strings ---'
          grep -Eo 'https?[^" ]+' /tmp/netlog.json | sed 's/\\u0026/\&/g' | grep -Ei 'api|search|query|graphql|record|formatgroup|polaris|discovery' | sort -u | head -200 || true
