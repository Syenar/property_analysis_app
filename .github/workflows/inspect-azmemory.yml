name: Inspect Arizona Memory Search
on:
  workflow_dispatch:
  push:
    branches: [temp-cloudflare-preview]
    paths: [.github/workflows/inspect-azmemory.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Arizona catalog API request contract
        shell: bash
        run: |
          set -euo pipefail
          base='https://asli.na5.iiivega.com'
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          query='Architects plan for the Arizona State Capitol in Phoenix'
          encoded=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$query")
          url="$base/search?query=$encoded&searchType=everything&pageSize=20"
          rm -f /tmp/netlog.json /tmp/dom.html
          timeout 45s "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --log-net-log=/tmp/netlog.json --net-log-capture-mode=IncludeSensitive --dump-dom "$url" > /tmp/dom.html 2>/tmp/chrome.err || true
          grep -q "Architect's plan for the Arizona State Capitol in Phoenix" /tmp/dom.html
          echo '--- netlog events for search endpoint ---'
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/netlog.json').read_text(errors='replace'))
          needle='/api/search-result/search/format-groups'
          for e in data.get('events',[]):
              text=json.dumps(e,ensure_ascii=False)
              if needle in text or ('UPLOAD' in text and 'Architect' in text):
                  print(json.dumps(e,ensure_ascii=False,indent=2)[:12000])
          PY
          echo '--- search JS endpoint context ---'
          curl -fsSL "$base/src_app_search_search_module_ts.f2046c7e74979d74.js" -o /tmp/search.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/search.js').read_text(errors='replace')
          for needle in ['search/format-groups','format-groups','search-result/search']:
              start=0
              print('\nNEEDLE',needle)
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  print(s[max(0,i-2500):i+3500])
                  start=i+len(needle)
                  if start>i+len(needle)+1: break
          PY
