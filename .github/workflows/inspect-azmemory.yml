name: Inspect Arizona Memory Search
on:
  workflow_dispatch:
  push:
    branches: [temp-cloudflare-preview]
    paths: [.github/workflows/inspect-azmemory.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe archive and credential-free development index
        shell: bash
        run: |
          set -u
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36'
          echo '--- Arizona Memory direct routes ---'
          for url in \
            'https://azmemory.azlibrary.gov/robots.txt' \
            'https://azmemory.azlibrary.gov/sitemap.xml' \
            'https://azmemory.azlibrary.gov/nodes/search' \
            'https://azmemory.azlibrary.gov/nodes/view/236509' \
            'https://azmemory.azlibrary.gov/nodes/view/236514'; do
            code=$(curl -A "$ua" -L -sS -o /tmp/body -w '%{http_code}' "$url" || true)
            echo "$code $url bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)"
          done
          echo '--- Purili development fallback searches ---'
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          queries=[
            '"1700 W Washington St" Phoenix architectural drawings',
            '"Arizona State Capitol" architectural drawings',
            'site:azmemory.azlibrary.gov "Arizona State Capitol" architectural drawings',
            'site:azmemory.azlibrary.gov "Architect\'s plan for the Arizona State Capitol in Phoenix"',
          ]
          for q in queries:
            url='https://puri.li/api/search?'+urllib.parse.urlencode({'q':q,'page':1,'exact':1})
            req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'PropertyAnalysisApp/0.3 archive-discovery-test'})
            try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                data=json.load(resp)
              print('\nQUERY',q,'results',len(data.get('results',[])))
              for r in data.get('results',[])[:10]:
                print(r.get('title',''), r.get('url',''), '-', r.get('description','')[:180])
            except Exception as e:
              print('\nQUERY',q,'ERROR',repr(e))
          PY
