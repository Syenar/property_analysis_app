name: Inspect Arizona Memory Search
on:
  workflow_dispatch:
  push:
    branches: [temp-cloudflare-preview]
    paths: [.github/workflows/inspect-azmemory.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe allowed archive discovery routes
        shell: bash
        run: |
          set -u
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36'
          for url in \
            'https://azmemory.azlibrary.gov/robots.txt' \
            'https://azmemory.azlibrary.gov/sitemap.xml' \
            'https://azmemory.azlibrary.gov/nodes/search' \
            'https://azmemory.azlibrary.gov/nodes/view/236509' \
            'https://azmemory.azlibrary.gov/nodes/view/236514'; do
            echo "=== $url ==="
            code=$(curl -A "$ua" -L -sS -o /tmp/body -w '%{http_code}' "$url" || true)
            echo "HTTP $code bytes $(wc -c </tmp/body 2>/dev/null || echo 0)"
            head -c 800 /tmp/body 2>/dev/null | tr '\n' ' '; echo
          done
          echo '--- search form with browser UA ---'
          code=$(curl -A "$ua" -L -sS -o /tmp/search.html -w '%{http_code}' 'https://azmemory.azlibrary.gov/nodes/search' || true)
          echo "HTTP $code"
          if [ "$code" = 200 ]; then
            grep -Eoi '<form[^>]*>|<input[^>]*>|<select[^>]*>|<button[^>]*>' /tmp/search.html | head -160 || true
            grep -Eoi '.{0,120}(search|keyword|query|term).{0,220}' /tmp/search.html | head -160 || true
          fi
