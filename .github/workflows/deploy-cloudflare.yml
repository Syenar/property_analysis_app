name: Deploy Temporary Cloudflare Preview

on:
  push:
    branches:
      - temp-cloudflare-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply parcel accuracy and viewer update
        run: |
          node scripts/patch-preview-ui.mjs
          node scripts/patch-preview-app-view.mjs
          node scripts/patch-preview-app-render.mjs
          node scripts/patch-preview-engine.mjs
          node scripts/patch-preview-tests.mjs
      - name: Apply blueprint and building-plan discovery update
        shell: bash
        run: |
          cat _blueprint_patch/p00.b64 _blueprint_patch/p01.b64 _blueprint_patch/p02.b64 _blueprint_patch/p03.b64 _blueprint_patch/p04.b64 | base64 -d > /tmp/patch-preview-blueprints.mjs
          echo '9f93d27a65d83c0257d19e4a00aa03146fe311f77f32cdf741a8399629f0f9e1  /tmp/patch-preview-blueprints.mjs' | sha256sum -c -
          node /tmp/patch-preview-blueprints.mjs
      - name: Verify updated preview source
        run: |
          npm test
          npm run check
      - name: Deploy temporary Worker and static assets
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.130.0 deploy --temporary --config cloudflare/wrangler.toml > /tmp/wrangler.out 2>&1
          status=$?
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/wrangler.out').read_text(errors='replace')
          text = re.sub(r'https://dash\.cloudflare\.com/[^\s\x1b]+', '[REDACTED_CLOUDFLARE_CLAIM_URL]', text)
          text = re.sub(r'(?im)^.*claim(?:ing)?(?: url| link| token)?.*$', '[Cloudflare claim information redacted]', text)
          print(text)
          PY
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          set -e
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler.out | tail -n 1)
          test -n "$url"
          echo "Public preview: $url"

          healthy=0
          for attempt in $(seq 1 20); do
            code=$(curl --silent --show-error -o /tmp/health.json -w '%{http_code}' "$url/api/health" || true)
            if [ "$code" = "200" ] && grep -q '"ok"' /tmp/health.json; then
              healthy=1
              break
            fi
            echo "Waiting for public Worker routing (attempt $attempt, HTTP $code)..."
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo 'Temporary Worker never became healthy.' >&2
            cat /tmp/health.json >&2 || true
            exit 1
          fi
          cat /tmp/health.json

          set +e
          timeout 30s curl --silent --show-error --no-buffer \
            -H 'content-type: application/json' \
            --data '{"address":"1600 Pennsylvania Avenue NW, Washington, DC 20500","fetchOrdinanceDocuments":false,"fetchBlueprintDocuments":true,"maxGisCandidates":1,"maxOrdinanceDocuments":1,"maxBlueprintDocuments":1}' \
            "$url/api/research/stream" > /tmp/research.ndjson
          research_status=$?
          set -e
          head -n 25 /tmp/research.ndjson || true
          if grep -Fqi 'Illegal invocation' /tmp/research.ndjson; then
            echo 'Cloudflare illegal-invocation regression detected.' >&2
            exit 1
          fi
          if grep -Fqi 'error code: 1042' /tmp/research.ndjson; then
            echo 'Cloudflare Worker-to-Worker routing regression detected.' >&2
            exit 1
          fi
          if ! grep -q '^{' /tmp/research.ndjson; then
            echo "Research stream did not produce NDJSON (curl status $research_status)." >&2
            exit 1
          fi
          if ! grep -q '"stage":"plans"' /tmp/research.ndjson; then
            echo 'Blueprint/plan research stage was not present in the live stream.' >&2
            exit 1
          fi
          echo 'Live Cloudflare research + blueprint-stage smoke check passed.'
