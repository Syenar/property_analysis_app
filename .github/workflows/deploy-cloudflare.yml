name: Deploy Temporary Cloudflare Preview
on:
  push:
    branches: [temp-cloudflare-preview]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply preview updates
        shell: bash
        run: |
          node scripts/patch-preview-ui.mjs
          node scripts/patch-preview-app-view.mjs
          node scripts/patch-preview-app-render.mjs
          node scripts/patch-preview-engine.mjs
          node scripts/patch-preview-tests.mjs
          cat _blueprint_patch/p00.b64 _blueprint_patch/p01.b64 _blueprint_patch/p02a.b64 _blueprint_patch/p02b.b64 _blueprint_patch/p02c.b64 _blueprint_patch/p03.b64 _blueprint_patch/p04.b64 | base64 -d > /tmp/blueprints.mjs
          echo '9f93d27a65d83c0257d19e4a00aa03146fe311f77f32cdf741a8399629f0f9e1  /tmp/blueprints.mjs' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/blueprints.mjs')
          s=p.read_text()
          s=s.replace("  `  async queryAttachments(serviceUrl, layerId, objectId, { signal } = {}) {", "  \"  async queryAttachments(serviceUrl, layerId, objectId, { signal } = {}) {", 1)
          s=s.replace("  firstFeature(result) {\\n`);", "  firstFeature(result) {\\n\");", 1)
          s=s.replace("`  firstFeature(result) {\\n`,", "`  firstFeature(result) { return result?.features?.[0] || null; }\\n`,", 1)
          s=s.replace("  firstFeature(result) {\\n\");", "  firstFeature(result) { return result?.features?.[0] || null; }\\n\");", 1)
          legacy = "    } else {\\n      // Parcel ownership/geometry is frequently maintained by the county even\\n"
          preview = "    } else {\\n      for (const row of jurisdictionSearchScopes(jurisdiction, { includeCounty:true, includeState:true })) {\\n"
          s=s.replace(legacy, preview, 2)
          s=s.replace("for (const path of ['cloudflare/worker.mjs','src/server/node-server.mjs'])", "for (const path of ['cloudflare/worker.mjs'])", 1)
          for expr in [
              '${row.place}',
              '${blueprintSources.length}',
              "${blueprintSources.length===1?'':'s'}",
              '${candidate.url}',
              '${error.message}',
              '${planCount}',
              "${planCount===1?'':'s'}",
              '${fetchedPlanCount}',
              "${fetchedPlanCount===1?'':'s'}",
              '${planSources.length}',
              '${source.confidence}'
          ]:
              s=s.replace(expr, '\\' + expr)
          p.write_text(s)
          PY
          node --check /tmp/blueprints.mjs
          set +e
          node /tmp/blueprints.mjs > blueprint-patch-error.log 2>&1
          patch_status=$?
          set -e
          if [ "$patch_status" -ne 0 ]; then
            cat blueprint-patch-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blueprint-patch-error.log
            git commit -m "Record blueprint preview patch failure" || true
            git push origin HEAD:temp-cloudflare-preview
            exit "$patch_status"
          fi
          rm -f blueprint-patch-error.log
          node scripts/patch-preview-blueprint-finalize.mjs
          node scripts/patch-preview-address-normalization.mjs
          cat > src/core/abort.mjs <<'EOF'
          export function createAbortError(message = 'The operation was aborted') {
            const error = new Error(message);
            error.name = 'AbortError';
            error.code = 'ABORT_ERR';
            return error;
          }
          export function isAbortError(error) {
            return error?.name === 'AbortError' || error?.code === 'ABORT_ERR';
          }
          export function abortReason(signal, fallbackMessage = 'The operation was aborted') {
            if (!signal?.aborted) return null;
            if (signal.reason instanceof Error) return signal.reason;
            return createAbortError(typeof signal.reason === 'string' && signal.reason.trim() ? signal.reason : fallbackMessage);
          }
          export function throwIfAborted(signal) {
            if (signal?.aborted) throw abortReason(signal);
          }
          export function rethrowIfAborted(error, signal) {
            if (signal?.aborted) throw abortReason(signal) || error;
            if (isAbortError(error)) throw error;
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/api-input.test.mjs')
          s=p.read_text()
          s=s.replace("maxGisCandidates:999, maxOrdinanceDocuments:-4, fetchOrdinanceDocuments:true", "maxGisCandidates:999, maxOrdinanceDocuments:-4, maxBlueprintDocuments:99, fetchOrdinanceDocuments:true")
          s=s.replace("address:'200 E Colfax Ave, Denver, CO 80203', maxGisCandidates:20, maxOrdinanceDocuments:0, fetchOrdinanceDocuments:true", "address:'200 E Colfax Ave, Denver, CO 80203', maxGisCandidates:20, maxOrdinanceDocuments:0, maxBlueprintDocuments:10, fetchOrdinanceDocuments:true, fetchBlueprintDocuments:true")
          p.write_text(s)
          PY
          grep -q "import { rethrowIfAborted } from '../core/abort.mjs';" src/engine/property-research-engine.mjs
          grep -q 'blueprintResearch' web/app.js
          grep -q 'blueprintResearch' src/packets/research-packet.mjs
          grep -q 'permit-record-attachment' src/plans/blueprint-discovery.mjs
          grep -q 'harvestedAddressQueries' src/plans/archive-catalog-discovery.mjs
          npm test
          npm run check
      - name: Deploy and verify temporary Worker
        shell: bash
        run: |
          set +e
          wrangler_args=(deploy --temporary --config cloudflare/wrangler.toml)
          if [ -n "${BRAVE_SEARCH_API_KEY:-}" ]; then
            wrangler_args+=(--var "BRAVE_SEARCH_API_KEY:$BRAVE_SEARCH_API_KEY")
          fi
          npx --yes wrangler@4.130.0 "${wrangler_args[@]}" > /tmp/wrangler.out 2>&1
          status=$?
          set -e
          sed -E -e 's#https://dash\.cloudflare\.com/[^ ]+#[claim-url-redacted]#g' -e '/BRAVE_SEARCH_API_KEY/s/.*/env.BRAVE_SEARCH_API_KEY ([redacted])/' /tmp/wrangler.out
          test "$status" -eq 0
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler.out | tail -1)
          test -n "$url"
          echo "Public preview: $url"
          healthy=0
          for attempt in $(seq 1 20); do
            code=$(curl --silent --show-error -o /tmp/health -w '%{http_code}' "$url/api/health" || true)
            if [ "$code" = "200" ] && grep -q '"ok"' /tmp/health; then
              healthy=1
              break
            fi
            echo "Waiting for public Worker health routing (attempt $attempt, HTTP $code)..."
            sleep 2
          done
          test "$healthy" -eq 1
          cat /tmp/health
          research_ready=0
          for attempt in $(seq 1 15); do
            : > /tmp/research.ndjson
            code=$(timeout 150s curl --silent --show-error --no-buffer -o /tmp/research.ndjson -w '%{http_code}' -H 'content-type: application/json' --data '{"address":"1700 W WASHINGTON ST, PHOENIX, AZ, 85007","fetchOrdinanceDocuments":false,"fetchBlueprintDocuments":true,"maxGisCandidates":4,"maxBlueprintDocuments":4}' "$url/api/research/stream" || true)
            if [ "$code" = "200" ] && grep -q '"type":"result"' /tmp/research.ndjson; then
              research_ready=1
              break
            fi
            echo "Waiting for public Worker research routing (attempt $attempt, HTTP $code)..."
            sleep 2
          done
          echo '--- Phoenix blueprint research stream ---'
          cat /tmp/research.ndjson
          echo '--- end research stream ---'
          test "$research_ready" -eq 1
          grep -q '"stage":"plans"' /tmp/research.ndjson
          grep -q '"type":"result"' /tmp/research.ndjson
          grep -q '"blueprintResearch":{"attempted":true' /tmp/research.ndjson
          grep -q '236509' /tmp/research.ndjson
          grep -q '236514' /tmp/research.ndjson
          grep -q '236520' /tmp/research.ndjson
          ! grep -q '"type":"error"' /tmp/research.ndjson
          ! grep -Fqi 'rethrowIfAborted is not defined' /tmp/research.ndjson
          ! grep -Fqi 'signal is not defined' /tmp/research.ndjson
          ! grep -Fqi 'Illegal invocation' /tmp/research.ndjson
          ! grep -Fqi 'error code: 1042' /tmp/research.ndjson
          echo 'Live Phoenix regression passed: all three Arizona Capitol plan records were returned.'
