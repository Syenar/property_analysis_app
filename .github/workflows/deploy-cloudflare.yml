name: Deploy Temporary Cloudflare Preview

on:
  push:
    branches:
      - temp-cloudflare-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy temporary Worker and static assets
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.130.0 deploy --temporary --config cloudflare/wrangler.toml > /tmp/wrangler.out 2>&1
          status=$?
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/wrangler.out').read_text(errors='replace')
          text = re.sub(r'https://dash\.cloudflare\.com/[^\s\x1b]+', '[REDACTED_CLOUDFLARE_CLAIM_URL]', text)
          text = re.sub(r'(?im)^.*claim(?:ing)?(?: url| link| token)?.*$', '[Cloudflare claim information redacted]', text)
          print(text)
          PY
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/wrangler.out | tail -n 1)
          test -n "$url"
          echo "Public preview: $url"
          curl --fail --silent --show-error "$url/api/health" | tee /tmp/health.json
          grep -q '"ok"' /tmp/health.json
          set +e
          timeout 30s curl --silent --show-error --no-buffer \
            -H 'content-type: application/json' \
            --data '{"address":"1600 Pennsylvania Avenue NW, Washington, DC 20500","fetchOrdinanceDocuments":false,"maxGisCandidates":1,"maxOrdinanceDocuments":1}' \
            "$url/api/research/stream" > /tmp/research.ndjson
          research_status=$?
          set -e
          head -n 20 /tmp/research.ndjson || true
          if grep -Fqi 'Illegal invocation' /tmp/research.ndjson; then
            echo 'Cloudflare illegal-invocation regression detected.' >&2
            exit 1
          fi
          if [ ! -s /tmp/research.ndjson ]; then
            echo "Research stream produced no response (curl status $research_status)." >&2
            exit 1
          fi
          echo 'Live Cloudflare research smoke check passed.'
